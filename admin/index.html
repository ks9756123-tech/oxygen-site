<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>문의함 | (주)수 Water 관리자</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Pretendard Variable", -apple-system, "Malgun Gothic", sans-serif; font-size: 16px; line-height: 1.6; color: #102230; background: #F5F9FC; word-break: keep-all; }
    header { background: #0A2A43; color: #fff; padding: 16px 20px; }
    header h1 { margin: 0; font-size: 18px; }
    main { max-width: 760px; margin: 0 auto; padding: 20px; }
    :focus-visible { outline: 3px solid #36B6E0; outline-offset: 2px; }
    .login { background: #fff; border: 1px solid #D6E1EA; border-radius: 12px; padding: 24px; display: grid; gap: 12px; margin-top: 24px; }
    input { font: inherit; font-size: 17px; min-height: 52px; padding: 0 14px; border: 1.5px solid #B9C8D5; border-radius: 6px; width: 100%; }
    button { font: inherit; font-weight: 700; min-height: 48px; padding: 0 16px; border-radius: 6px; border: 1.5px solid #B9C8D5; background: #fff; color: #102230; cursor: pointer; }
    .primary { background: #1466B8; border-color: #1466B8; color: #fff; }
    .err { color: #B42318; font-weight: 600; margin: 0; }
    .summary { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 8px 0 20px; }
    .summary strong { font-size: 44px; line-height: 1; color: #0A2A43; }
    .summary span { color: #56687A; }
    .summary button { margin-left: auto; }
    .card { background: #fff; border: 1px solid #D6E1EA; border-radius: 12px; padding: 18px; margin-bottom: 14px; display: grid; gap: 8px; }
    .card.is-new { border-left: 5px solid #F26A21; }
    .row1 { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .row1 b { font-size: 18px; }
    .date { color: #56687A; font-size: 14px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { background: #EEF6FC; color: #12385A; border-radius: 999px; padding: 2px 10px; font-size: 14px; font-weight: 600; }
    .contact { justify-self: start; border: 0; padding: 0; min-height: 0; background: none; color: #1466B8; font-size: 18px; text-decoration: underline; }
    .msg { white-space: pre-wrap; margin: 0; color: #33475A; }
    .states { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
    .states button[aria-pressed="true"] { background: #0A2A43; border-color: #0A2A43; color: #fff; }
    .empty { color: #56687A; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
<header><h1>(주)수 Water 문의함</h1></header>
<main>
  <form class="login" id="login">
    <label for="pw"><b>관리자 비밀번호</b></label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">들어가기</button>
    <p class="err" id="login-err" role="alert"></p>
  </form>

  <section id="box" hidden>
    <div class="summary">
      <strong id="new-count">0</strong><span>건의 새 문의</span>
      <button type="button" id="reload">새로고침</button>
    </div>
    <p class="err" id="box-err" role="alert"></p>
    <div id="list"></div>
  </section>
</main>

<script>
(function () {
  var KEY = 'aw-admin-pw';
  var STATUSES = ['새 문의', '연락함', '완료'];
  var $ = function (id) { return document.getElementById(id); };

  function pw() { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setPw(v) { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch (e) {} }

  async function call(method, body) {
    var res = await fetch('/api/admin', {
      method: method,
      headers: { 'x-admin-password': pw(), 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    var out = await res.json().catch(function () { return {}; });
    return { status: res.status, ok: res.ok, data: out };
  }

  function showLogin(message) {
    setPw('');
    $('box').hidden = true;
    $('login').hidden = false;
    $('login-err').textContent = message || '';
    $('pw').value = '';
    $('pw').focus();
  }

  function fmt(iso) {
    var d = new Date(iso);
    return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '. ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function render(rows) {
    $('new-count').textContent = rows.filter(function (r) { return r.status === '새 문의'; }).length;
    var list = $('list');
    list.textContent = '';
    if (!rows.length) { list.appendChild(el('p', 'empty', '아직 들어온 문의가 없어요.')); return; }
    rows.forEach(function (r) {
      var card = el('article', 'card' + (r.status === '새 문의' ? ' is-new' : ''));
      var top = el('div', 'row1');
      top.appendChild(el('b', '', r.name));
      top.appendChild(el('span', 'date', fmt(r.created_at)));
      card.appendChild(top);

      var tags = el('div', 'tags');
      if (r.business_type) tags.appendChild(el('span', 'tag', r.business_type));
      if (r.product) tags.appendChild(el('span', 'tag', r.product));
      if (tags.childNodes.length) card.appendChild(tags);

      var c = el('button', 'contact', r.contact);
      c.type = 'button';
      c.title = '눌러서 복사';
      c.addEventListener('click', function () {
        var done = function () { c.textContent = r.contact + '  (복사됨)'; setTimeout(function () { c.textContent = r.contact; }, 1500); };
        if (navigator.clipboard) navigator.clipboard.writeText(r.contact).then(done, function () { selectText(c); });
        else selectText(c);
      });
      card.appendChild(c);

      if (r.message) card.appendChild(el('p', 'msg', r.message));

      var states = el('div', 'states');
      STATUSES.forEach(function (s) {
        var b = el('button', '', s);
        b.type = 'button';
        b.setAttribute('aria-pressed', String(r.status === s));
        b.addEventListener('click', async function () {
          if (r.status === s) return;
          var out = await call('PATCH', { id: r.id, status: s });
          if (out.status === 401) return showLogin(out.data.error);
          if (!out.ok) { $('box-err').textContent = out.data.error || '바꾸지 못했어요.'; return; }
          load();
        });
        states.appendChild(b);
      });
      card.appendChild(states);
      list.appendChild(card);
    });
  }

  function selectText(node) {
    var range = document.createRange();
    range.selectNodeContents(node);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  async function load() {
    $('box-err').textContent = '';
    var out = await call('GET');
    if (out.status === 401) return showLogin(out.data.error);
    if (!out.ok) {
      $('login').hidden = true; $('box').hidden = false;
      $('box-err').textContent = out.data.error || '불러오지 못했어요.';
      return;
    }
    $('login').hidden = true;
    $('box').hidden = false;
    render(out.data.rows || []);
  }

  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    setPw($('pw').value);
    load();
  });
  $('reload').addEventListener('click', load);

  if (pw()) load(); else $('pw').focus();
})();
</script>
</body>
</html>
